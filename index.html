<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pine Hollow — Low-Poly Pacific Northwest Town (Three.js)</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="loader">
      <div class="loader-inner">
        <div class="loader-title">Pine Hollow</div>
        <div class="loader-sub">Pacific Northwest · Low-Poly World</div>
        <div class="loader-bar"><div id="loader-fill"></div></div>
        <div id="loader-status">Loading…</div>
      </div>
    </div>
    <div id="hud">
      <div class="title">Pine Hollow</div>
      <div id="hud-shot"></div>
      <div class="keys">V drive · G walk · F in/out of car · 1–0 shots · N next · T tour · F free-fly (WASD/QE, Shift) · H hide UI</div>
    </div>
    <div id="hud-stats"></div>
    <div id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
